<!doctype html><html lang="en"><meta charset="utf-8"><title>Jarvis Command Center</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#0b1220;color:#e7efff;font:16px system-ui;margin:36px}main{max-width:1000px;margin:auto}section{background:#172238;padding:22px;border-radius:12px;margin:18px 0}input,select,textarea,button{padding:10px;background:#243551;color:white;border:1px solid #567;border-radius:6px}button{cursor:pointer}textarea{width:95%;min-height:60px}pre{white-space:pre-wrap;overflow-wrap:anywhere}h1{color:#9ed0ff}</style><main><h1>JARVIS / Command Center</h1><section><label>Admin token <input id="token" type="password" autocomplete="off"></label> <button onclick="refresh()">Refresh</button><p id="status">Awaiting authorization</p></section><section><h2>Queue an agent task</h2><select id="agent"><option value="rosie">Rosie</option><option value="benson">Benson</option><option value="mr-belvedere">Mr. Belvedere</option></select><textarea id="prompt" placeholder="Task prompt"></textarea><button onclick="submitJob()">Queue task</button></section><section><h2>Agents</h2><pre id="agents"></pre></section><section><h2>Jobs</h2><div id="jobs"></div></section><section><h2>Audit events</h2><pre id="audit"></pre></section><script>function headers(){return {'X-Jarvis-Token':document.getElementById('token').value,'Content-Type':'application/json'}}async function api(path,options={}){const r=await fetch('/control/'+path,{headers:headers(),...options});if(!r.ok)throw Error('HTTP '+r.status);return r.json()}async function submitJob(){try{await api('jobs',{method:'POST',body:JSON.stringify({agent:document.getElementById('agent').value,prompt:document.getElementById('prompt').value})});await refresh()}catch(e){document.getElementById('status').textContent=e.message}}async function cancelJob(id){try{await api('jobs/'+encodeURIComponent(id)+'/cancel',{method:'POST'});await refresh()}catch(e){document.getElementById('status').textContent=e.message}}async function refresh(){try{document.getElementById('agents').textContent=JSON.stringify(await api('agents'),null,2);const jobs=await api('jobs');const box=document.getElementById('jobs');box.replaceChildren();for(const j of jobs){const row=document.createElement('p');row.textContent=j.agent+' | '+j.status+' | '+j.prompt.slice(0,90)+' ';if(j.status==='queued'||j.status==='running'){const b=document.createElement('button');b.textContent='Cancel';b.onclick=()=>cancelJob(j.id);row.appendChild(b)}box.appendChild(row)}document.getElementById('audit').textContent=JSON.stringify(await api('audit'),null,2);document.getElementById('status').textContent='Connected'}catch(e){document.getElementById('status').textContent=e.message}}setInterval(()=>{if(document.getElementById('token').value)refresh()},5000)</script></main></html>
